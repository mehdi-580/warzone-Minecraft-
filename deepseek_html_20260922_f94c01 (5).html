<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>منطقه جنگی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0c0a;font-family:Tahoma,sans-serif}
#c{display:block;width:100%;height:100%}
#mistOverlay{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle at center,rgba(180,200,190,0) 25%,rgba(160,185,175,0.18) 65%,rgba(150,175,165,0.32) 100%)}
#hud{position:fixed;inset:0;pointer-events:none;color:#9f9}
.zone{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0));width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9f9;text-shadow:0 0 6px rgba(0,255,0,.6);text-align:center;flex-direction:column}
#zoneL{left:22px}#zoneR{right:22px}
#joy{position:absolute;left:22px;bottom:calc(26px + env(safe-area-inset-bottom,0));width:130px;height:130px;border-radius:50%;border:2px solid rgba(120,255,120,.4);background:rgba(10,25,10,.3);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#7f7,#1a3a1a);box-shadow:0 0 12px rgba(0,255,0,.5)}
#look{position:absolute;right:0;top:0;width:45%;height:100%;pointer-events:auto;touch-action:none;z-index:2}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;opacity:.75}
#cross::before,#cross::after{content:'';position:absolute;background:#8f8}
#cross::before{left:9px;top:2px;width:2px;height:16px}
#cross::after{top:9px;left:2px;width:16px;height:2px}
#hpWrap{position:absolute;left:14px;bottom:calc(172px + env(safe-area-inset-bottom,0));width:150px}
#hpLabel{color:#cfc;font-size:11px;margin-bottom:3px}
#hpBarBg{width:100%;height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
#hpBar{height:100%;width:100%;background:linear-gradient(90deg,#3ecf3e,#8fef6a);transition:width .25s}
#ammoBox{position:absolute;right:14px;bottom:calc(172px + env(safe-area-inset-bottom,0));color:#dfd;font-size:16px;text-align:left;font-weight:bold;min-width:130px}
#ammoBox .wname{font-size:11px;color:#cfa;display:block;font-weight:normal}
#ammoBox .reserve{font-size:11px;opacity:.6;font-weight:normal}
#reloadTxt{display:block;font-size:10px;color:#fc6;opacity:0;margin-top:2px}
#statusBar{position:absolute;top:calc(64px + env(safe-area-inset-top,0));left:14px;font-size:11px;background:rgba(0,15,0,.4);padding:5px 10px;border-radius:5px;text-align:right;min-width:118px}
#minimap{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top,0));width:104px;height:104px;border-radius:50%;border:1px solid rgba(120,255,120,.35);background:rgba(0,10,0,.5)}
#btnJump{position:absolute;right:170px;bottom:calc(30px + env(safe-area-inset-bottom,0));width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(80,180,255,.9),rgba(20,60,120,.9));border:2px solid rgba(150,220,255,.85);color:#fff;font-size:12px;font-weight:bold;pointer-events:auto;opacity:0;transition:opacity .3s,transform .1s,background .2s;font-family:inherit;z-index:10;cursor:pointer;box-shadow:0 6px 20px rgba(0,150,255,.5),inset 0 2px 6px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;line-height:1.1}
#btnJump .icon{font-size:26px}
#btnJump.carMode{background:radial-gradient(circle at 30% 30%,rgba(120,255,120,.95),rgba(20,120,30,.95));border-color:rgba(200,255,200,.9)}
#btnJump.tankMode{background:radial-gradient(circle at 30% 30%,rgba(255,200,80,.95),rgba(140,80,10,.95));border-color:rgba(255,220,140,.95);box-shadow:0 6px 20px rgba(255,150,40,.6)}
#btnJump.mlrsMode{background:radial-gradient(circle at 30% 30%,rgba(180,80,255,.95),rgba(60,10,120,.95));border-color:rgba(200,140,255,.95);box-shadow:0 6px 20px rgba(150,60,255,.6)}
#btnJump.exitMode{background:radial-gradient(circle at 30% 30%,rgba(255,90,90,.95),rgba(120,20,20,.95));border-color:rgba(255,150,150,.9)}
#btnJump:active{transform:scale(.9)}
#btnFire{position:absolute;right:60px;bottom:calc(130px + env(safe-area-inset-bottom,0));width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,80,30,.95),rgba(120,20,10,.95));border:3px solid rgba(255,150,80,.9);color:#fff;font-size:13px;font-weight:bold;pointer-events:auto;opacity:0;transition:opacity .3s,transform .1s,background .2s;font-family:inherit;z-index:10;cursor:pointer;box-shadow:0 6px 24px rgba(255,80,30,.7),inset 0 2px 6px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;line-height:1.1}
#btnFire .icon{font-size:34px}
#btnFire.mlrsFire{background:radial-gradient(circle at 30% 30%,rgba(255,60,200,.95),rgba(120,10,80,.95));border-color:rgba(255,150,220,.95);box-shadow:0 6px 24px rgba(255,60,200,.7)}
#btnFire:active{transform:scale(.88)}
#speedo{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0));transform:translateX(-50%);color:#9f9;font-size:13px;font-weight:bold;background:rgba(0,20,0,.6);padding:6px 18px;border-radius:20px;border:1px solid rgba(120,255,140,.4);display:none;text-shadow:0 0 6px #0f0;letter-spacing:1px}
#tankHpBar{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0));transform:translateX(-50%);width:200px;display:none;background:rgba(0,0,0,.5);border-radius:6px;padding:4px;border:1px solid rgba(255,200,80,.5)}
#tankHpInner{height:12px;background:linear-gradient(90deg,#ffaa33,#ffdd66);border-radius:4px;width:100%;transition:width .2s}
#tankHpLabel{position:absolute;top:calc(46px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);color:#ffd;font-size:11px;text-shadow:0 0 6px #000;display:none}
#bossBar{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0));transform:translateX(-50%);width:280px;max-width:90%;display:none;background:linear-gradient(180deg,rgba(30,0,0,.85),rgba(60,0,0,.7));border:2px solid rgba(255,60,60,.8);border-radius:10px;padding:6px 10px;box-shadow:0 6px 24px rgba(255,0,0,.5),inset 0 0 20px rgba(255,0,0,.2)}
#bossName{color:#ffcccc;font-size:13px;font-weight:bold;text-align:center;text-shadow:0 0 8px #f00;letter-spacing:2px;margin-bottom:4px}
#bossHpBg{width:100%;height:14px;background:rgba(0,0,0,.7);border-radius:4px;overflow:hidden;border:1px solid rgba(255,80,80,.5)}
#bossHpInner{height:100%;width:100%;background:linear-gradient(90deg,#ff2222,#ff6633,#ff9944);transition:width .15s;box-shadow:0 0 12px rgba(255,60,60,.7)}
#centerMsg{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);color:#dfd;font-size:16px;text-shadow:0 0 8px #0f0;opacity:0;transition:opacity .5s;text-align:center;width:90%}
#hitmark{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .12s}
#hitmark.on{opacity:1}
#hitmark::before,#hitmark::after{content:'';position:absolute;background:#fff;box-shadow:0 0 4px #fff}
#hitmark::before{left:0;top:12px;width:26px;height:2px;transform:rotate(45deg)}
#hitmark::after{left:0;top:12px;width:26px;height:2px;transform:rotate(-45deg)}
#dmgFlash{position:absolute;inset:0;background:radial-gradient(circle,transparent 50%,rgba(200,0,0,.6) 100%);opacity:0;transition:opacity .25s}
#killfeed{position:absolute;right:14px;top:calc(122px + env(safe-area-inset-top,0));font-size:12px;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#killfeed div{opacity:0;transition:opacity .4s}
#livesBox{position:absolute;top:calc(122px + env(safe-area-inset-top,0));right:14px;font-size:11px;background:rgba(0,20,0,.5);padding:4px 10px;border-radius:5px;border:1px solid rgba(255,100,100,.3);color:#fc9}
#gameover{position:absolute;inset:0;background:rgba(5,7,5,.9);display:none;align-items:center;justify-content:center;flex-direction:column;color:#ddd;z-index:15;pointer-events:auto;text-align:center}
#gameover h2{font-size:26px;margin-bottom:10px;text-shadow:0 0 10px #0f0}
#gameover p{font-size:13px;color:#9c9;margin-bottom:4px}
#gameover button{margin-top:18px;padding:11px 30px;border-radius:8px;border:1px solid #6c6;background:#163216;color:#cfc;font-size:14px;font-family:inherit;cursor:pointer}
#startOverlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(8,16,10,.85),rgba(2,5,3,.96));display:flex;align-items:center;justify-content:center;z-index:12;pointer-events:auto;padding:16px}
.menuCard{position:relative;background:linear-gradient(160deg,rgba(22,40,24,.95),rgba(8,16,10,.98));border:1px solid rgba(120,255,140,.25);border-radius:24px;padding:30px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.75),0 0 120px rgba(60,220,90,.12)}
.menuTitle{font-size:34px;font-weight:900;letter-spacing:3px;margin:0 0 22px;background:linear-gradient(135deg,#e8ffe8,#6dff6d 45%,#b6ffc0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 14px rgba(90,255,130,.5))}
.menuBtn{position:relative;width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(100deg,#2a7a2a,#48c948 50%,#2a7a2a);background-size:200% 100%;color:#fff;font-size:17px;font-weight:bold;font-family:inherit;letter-spacing:2px;cursor:pointer;overflow:hidden;box-shadow:0 8px 24px rgba(40,180,60,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.menuBtn>span{position:relative;z-index:2}
.menuBtn:active{transform:scale(.97)}
.menuSettings{margin-top:18px;padding-top:14px;border-top:1px solid rgba(120,255,140,.15)}
.settingsTitle{color:#cfa;font-size:11px;margin-bottom:8px;letter-spacing:1px}
.settingsBtns{display:flex;gap:6px}
.qBtn{flex:1;padding:9px 6px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(120,255,140,.2);color:#9c9;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s}
.qBtn:hover{border-color:rgba(120,255,140,.5);color:#cfc}
.qBtn.active{background:linear-gradient(100deg,#2a7a2a,#48c948);color:#fff;border-color:#7f7;font-weight:bold;box-shadow:0 4px 12px rgba(80,255,120,.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mistOverlay"></div>
<div id="hud">
<div id="cross"></div>
<div id="hitmark"></div>
<div id="dmgFlash"></div>
<div id="minimap"></div>
<div id="statusBar"><div id="stZone">محدوده امن: —</div><div id="stBots">حریفان زنده: 36</div><div id="stKills">حذف‌ها: 0</div></div>
<div id="livesBox">❤ جان‌ها: <span id="livesTxt">2</span></div>
<div id="killfeed"></div>
<div id="centerMsg"></div>
<div id="speedo">🚗 سرعت: <span id="speedVal">0</span> km/h</div>
<div id="tankHpBar"><div id="tankHpInner"></div></div>
<div id="tankHpLabel">🚜 سلامت تانک</div>
<div id="bossBar"><div id="bossName">☠️ نگهبان بلک مارکت</div><div id="bossHpBg"><div id="bossHpInner"></div></div></div>
<div class="zone" id="zoneL">حرکت</div>
<div class="zone" id="zoneR">شلیک</div>
<div id="joy"><div id="joyKnob"></div></div>
<div id="look"></div>
<div id="hpWrap"><div id="hpLabel">سلامتی</div><div id="hpBarBg"><div id="hpBar"></div></div></div>
<div id="ammoBox"><span class="wname" id="weaponName">بی سلاح</span><span id="ammoTxt">—</span> <span class="reserve" id="reserveTxt"></span><small id="reloadTxt">شارژ...</small></div>
<div id="btnJump"><span class="icon">🪂</span><span id="jumpLabel">پرش</span></div>
<div id="btnFire"><span class="icon">💥</span><span>شلیک</span></div>

<div id="startOverlay">
<div class="menuCard">
<h1 class="menuTitle">منطقه جنگی</h1>
<button id="btnStart" class="menuBtn"><span>شروع</span></button>
<div class="menuSettings">
<div class="settingsTitle">⚙️ کیفیت گرافیک</div>
<div class="settingsBtns">
<button class="qBtn" data-q="low">کم</button>
<button class="qBtn active" data-q="medium">متوسط</button>
<button class="qBtn" data-q="high">زیاد</button>
</div>
</div>
</div>
</div>

<div id="gameover">
<h2 id="goTitle">پایان</h2>
<p id="goSub1"></p><p id="goSub2"></p>
<button id="btnRestart">تلاش دوباره</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

var colliders=[];var obstacleMeshes=[];var cullables=[];
var tGlobal=0,MAP_HALF=320,ZONE_START=315,ZONE_MIN=40;
var camShake=0;

var QUALITY_PRESETS={
 low:    {name:'low',    pixelRatio:0.6, fogDensity:0.060, cullDist:90,  particles:false, antialias:false, grass:80,  trees:25, rocks:25, containers:20, buildings:60, bots:36},
 medium: {name:'medium', pixelRatio:1.0, fogDensity:0.042, cullDist:140, particles:true,  antialias:false, grass:180, trees:45, rocks:60, containers:40, buildings:100, bots:36},
 high:   {name:'high',   pixelRatio:1.4, fogDensity:0.030, cullDist:210, particles:true,  antialias:true,  grass:260, trees:65, rocks:90, containers:55, buildings:130, bots:36}
};
var currentQuality=localStorage.getItem('warzone_quality')||'medium';
if(!QUALITY_PRESETS[currentQuality])currentQuality='medium';
var Q=QUALITY_PRESETS[currentQuality];
var CULL_DIST2=Q.cullDist*Q.cullDist;

var canvas=document.getElementById('c');
var scene=new THREE.Scene();
var skyC=document.createElement('canvas');skyC.width=2;skyC.height=256;
var sctx=skyC.getContext('2d');var sgrad=sctx.createLinearGradient(0,0,0,256);
sgrad.addColorStop(0,'#3a4448');sgrad.addColorStop(0.45,'#5a6866');
sgrad.addColorStop(0.75,'#6a746e');sgrad.addColorStop(1,'#4a5450');
sctx.fillStyle=sgrad;sctx.fillRect(0,0,2,256);
var skyTex=new THREE.CanvasTexture(skyC);skyTex.minFilter=THREE.LinearFilter;
scene.background=skyTex;
scene.fog=new THREE.FogExp2(0x5a6866,Q.fogDensity);

var camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,300);
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:Q.antialias,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,Q.pixelRatio));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
renderer.outputEncoding=THREE.sRGBEncoding;

scene.add(new THREE.HemisphereLight(0x8a9aaa,0x3a4030,0.95));
var sun=new THREE.DirectionalLight(0xffe8c0,0.6);
sun.position.set(60,90,40);sun.castShadow=false;scene.add(sun);
var flick=new THREE.PointLight(0xffaa44,1.2,25,2);flick.position.set(-10,6,5);scene.add(flick);

var floorMat=new THREE.MeshStandardMaterial({color:0x3a4034,roughness:1,metalness:0});
var floor=new THREE.Mesh(new THREE.PlaneGeometry(MAP_HALF*2+40,MAP_HALF*2+40,1,1),floorMat);
floor.rotation.x=-Math.PI/2;scene.add(floor);

var grassMats=[new THREE.MeshStandardMaterial({color:0x2e4a28,roughness:1}),new THREE.MeshStandardMaterial({color:0x3a5c30,roughness:1}),new THREE.MeshStandardMaterial({color:0x264020,roughness:1})];
for(var gp=0;gp<Q.grass;gp++){
 var gx=(Math.random()*2-1)*(MAP_HALF-8),gz=(Math.random()*2-1)*(MAP_HALF-8);
 var gw=0.5+Math.random()*1.4,gh=0.05+Math.random()*0.14;
 var gmesh=new THREE.Mesh(new THREE.BoxGeometry(gw,gh,gw*0.7+Math.random()*0.5),grassMats[(Math.random()*3)|0]);
 gmesh.position.set(gx,gh/2,gz);scene.add(gmesh);cullables.push(gmesh);
}
var rockMat=new THREE.MeshStandardMaterial({color:0x6a6a65,roughness:1});
for(var rk=0;rk<Q.rocks;rk++){
 var rx=(Math.random()*2-1)*(MAP_HALF-10),rz=(Math.random()*2-1)*(MAP_HALF-10);
 var rs=0.3+Math.random()*1.0;
 var rock=new THREE.Mesh(new THREE.DodecahedronGeometry(rs,0),rockMat);
 rock.position.set(rx,rs*0.5,rz);rock.rotation.y=Math.random()*6;
 scene.add(rock);colliders.push({x:rx,z:rz,r:rs*1.1});
 obstacleMeshes.push(rock);cullables.push(rock);
}
var wallMat=new THREE.MeshStandardMaterial({color:0x4a5044,roughness:.95});
var wg=new THREE.BoxGeometry(MAP_HALF*2+4,10,2);
[[0,5,-MAP_HALF-1],[0,5,MAP_HALF+1]].forEach(function(p){var m=new THREE.Mesh(wg,wallMat);m.position.set(p[0],p[1],p[2]);scene.add(m);obstacleMeshes.push(m);});
var wg2=new THREE.BoxGeometry(2,10,MAP_HALF*2+4);
[[-MAP_HALF-1,5,0],[MAP_HALF+1,5,0]].forEach(function(p){var m=new THREE.Mesh(wg2,wallMat);m.position.set(p[0],p[1],p[2]);scene.add(m);obstacleMeshes.push(m);});

var mats=[new THREE.MeshStandardMaterial({color:0x5a6254,roughness:.9,metalness:.15}),new THREE.MeshStandardMaterial({color:0x6a5440,roughness:.95}),new THREE.MeshStandardMaterial({color:0x525c6a,roughness:.75,metalness:.3}),new THREE.MeshStandardMaterial({color:0x7a6e3e,roughness:.9})];
mats.push(new THREE.MeshStandardMaterial({color:0x424242,roughness:.9,metalness:.25}));      // 4 = prison wall
mats.push(new THREE.MeshStandardMaterial({color:0x35354a,roughness:.85,metalness:.3}));      // 5 = cell block
mats.push(new THREE.MeshStandardMaterial({color:0x5a5a5a,roughness:.95}));                   // 6 = concrete prison
function addBox(x,z,w,h,d,mi,ry){
 var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats[mi%mats.length]);
 m.position.set(x,h/2,z);m.rotation.y=ry||0;scene.add(m);
 colliders.push({x:x,z:z,r:Math.max(w,d)*0.62});
 obstacleMeshes.push(m);cullables.push(m);
}
var i,ang,dist,x,z,s,ry,n;
for(i=0;i<Q.buildings;i++){ang=Math.random()*Math.PI*2;dist=15+Math.random()*(MAP_HALF-20);x=Math.cos(ang)*dist;z=Math.sin(ang)*dist;s=2+Math.random()*4;addBox(x,z,s,s*(1.2+Math.random()*2.2),s,(Math.random()*4)|0,Math.random()*Math.PI);}
for(var t0=0;t0<30;t0++){ang=Math.random()*Math.PI*2;dist=20+Math.random()*(MAP_HALF-25);x=Math.cos(ang)*dist;z=Math.sin(ang)*dist;ry=Math.random()*Math.PI;n=2+(Math.random()*3|0);for(var j=0;j<n;j++)addBox(x+(Math.random()-.5)*.6,z+(Math.random()-.5)*.6,2.6,1.6,2.6,(Math.random()*4)|0,ry);}
var barrelMat=new THREE.MeshStandardMaterial({color:0x8a5030,roughness:.7,metalness:.4});
for(var b=0;b<60;b++){ang=Math.random()*Math.PI*2;dist=10+Math.random()*(MAP_HALF-15);var br=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.5,10),barrelMat);br.position.set(Math.cos(ang)*dist,.75,Math.sin(ang)*dist);scene.add(br);colliders.push({x:br.position.x,z:br.position.z,r:.8});obstacleMeshes.push(br);cullables.push(br);}

var concreteMat=new THREE.MeshStandardMaterial({color:0x666a63,roughness:.95});
var darkWindowMat=new THREE.MeshStandardMaterial({color:0x1a1f24,roughness:.5,metalness:.2});
function ruinedBuilding(cx,cz,w,d,floors){
 var fh=3.0;
 var base=new THREE.Mesh(new THREE.BoxGeometry(w,floors*fh,d),concreteMat);
 base.position.set(cx,floors*fh/2,cz);scene.add(base);
 obstacleMeshes.push(base);cullables.push(base);
 colliders.push({x:cx,z:cz,r:Math.max(w,d)*0.6});
 for(var f=0;f<floors;f++){for(var sid=0;sid<4;sid++){if(Math.random()<0.35){
  var wx=cx+((sid===0)?-w/2:(sid===2)?w/2:0);
  var wz=cz+((sid===1)?-d/2:(sid===3)?d/2:0);
  var wy=f*fh+fh/2;
  var win=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.0,0.6),darkWindowMat);
  win.position.set(wx,wy,wz);scene.add(win);}}}
}
for(var rbi=0;rbi<25;rbi++){
 var rbx=80+Math.random()*(MAP_HALF-100);
 var rbz=-220+Math.random()*440;
 if(Math.hypot(rbx,rbz)<30)continue;
 ruinedBuilding(rbx,rbz,6+Math.random()*4,6+Math.random()*4,2+(Math.random()*3|0));
}

// ============ BLACK MARKET ============
var marketFloorMat=new THREE.MeshStandardMaterial({color:0x1f1a28,roughness:.95,metalness:.1});
var marketFloor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),marketFloorMat);

function collide(nx,nz,ignoreCar,ignoreTank,ignoreMLRS){
 for(var i=0;i<colliders.length;i++){
  var c=colliders[i];
  if(ignoreCar&&c.car===ignoreCar)continue;
  if(ignoreTank&&c.tankRef===ignoreTank)continue;
  if(ignoreMLRS&&c.mlrsRef===ignoreMLRS)continue;
  var dx=nx-c.x,dz=nz-c.z;
  if(dx*dx+dz*dz<c.r*c.r)return true;
 }
 return Math.abs(nx)>MAP_HALF-2||Math.abs(nz)>MAP_HALF-2;
}
var losRaycaster=new THREE.Raycaster();
var losOrigin=new THREE.Vector3();
var losDir=new THREE.Vector3();
function hasLOS(fx,fz,tx,tz){
 losOrigin.set(fx,1.5,fz);
 losDir.set(tx-fx,0,tz-fz);
 var d=losDir.length();
 if(d<0.001)return true;
 losDir.divideScalar(d);
 losRaycaster.set(losOrigin,losDir);
 losRaycaster.far=d;
 var hits=losRaycaster.intersectObjects(obstacleMeshes,false);
 return hits.length===0;
}

 }

 }

function updateBots(dt){
 for(var i=0;i<bots.length;i++){
  var bot=bots[i];if(!bot.alive||bot.dropState!=='grounded')continue;
  if(bot.hitFlash>0){bot.hitFlash=Math.max(0,bot.hitFlash-dt*3.2);for(var mi=0;mi<bot.mats.length;mi++){bot.mats[mi].emissive.setRGB(1,1,1);bot.mats[mi].emissiveIntensity=bot.hitFlash*1.1;}}
  bot.gun.visible=!!bot.weapon;
  var w=bot.weapon?WEAPONS[bot.weapon]:null;
  if(bot.grenadeCooldown>0)bot.grenadeCooldown-=dt;

   var car=bot.car;car.botDriveTime+=dt;
   var goalX,goalZ;
   if(!bot.weapon){var nearest=findNearestLoot(bot.x,bot.z);if(nearest){goalX=nearest.x;goalZ=nearest.z;}else{goalX=bot.target.x;goalZ=bot.target.z;}}
   else{goalX=bot.target.x;goalZ=bot.target.z;}
   driveBotCar(car,goalX,goalZ,dt);
   bot.x=car.x;bot.z=car.z;bot.group.position.set(bot.x,0,bot.z);
   var carD=Math.hypot(goalX-car.x,goalZ-car.z);
   if(carD<6 || car.botDriveTime>12 || (Math.abs(car.velocity)<0.01 && car.botDriveTime>2)){botExitCar(bot);}
   continue;
  }
  if(tank&&tank.occupied&&tank.hp>0){
   var tdxB=tank.x-bot.x,tdzB=tank.z-bot.z,tdB=Math.hypot(tdxB,tdzB);

    var nxT=tdxB/tdB,nzT=tdzB/tdB;
    if(bot.grenades>0 && bot.grenadeCooldown<=0 && tdB<20){throwGrenade(bot.x,bot.z,tank.x,tank.z,bot);bot.grenades--;bot.grenadeCooldown=3+Math.random()*2;}
    if(tdB<11){botMove(bot,-nxT*0.08,-nzT*0.08);}
    else if(tdB>19 && bot.grenades>0){botMove(bot,nxT*0.06,nzT*0.06);}
    else{bot.strafeTimer-=dt;if(bot.strafeTimer<=0){bot.strafeDir=Math.random()<0.5?1:-1;bot.strafeTimer=1+Math.random();}botMove(bot,-nzT*bot.strafeDir*0.06,nxT*bot.strafeDir*0.06);}
    bot.yaw=Math.atan2(tdxB,tdzB);
    // walking animation
    var wT=bot.walking?Math.sin(tGlobal*9):0;
    var bobT=bot.walking?Math.abs(Math.sin(tGlobal*9))*0.07:0;
    bot.group.position.set(bot.x,bobT,bot.z);bot.group.rotation.y=bot.yaw;
    bot.armL.rotation.x=-wT*0.5;bot.armR.rotation.x=-0.6;
    bot.legL.rotation.x=wT;bot.legR.rotation.x=-wT;
    continue;
   }
  }
  if(mlrs&&mlrs.occupied&&mlrs.hp>0){
   var mdxB=mlrs.x-bot.x,mdzB=mlrs.z-bot.z,mdB=Math.hypot(mdxB,mdzB);
   if(mdB<26){
    var nxM=mdxB/mdB,nzM=mdzB/mdB;
    if(bot.grenades>0 && bot.grenadeCooldown<=0 && mdB<20){throwGrenade(bot.x,bot.z,mlrs.x,mlrs.z,bot);bot.grenades--;bot.grenadeCooldown=3+Math.random()*2;}
    if(mdB<11){botMove(bot,-nxM*0.08,-nzM*0.08);}
    else if(mdB>19 && bot.grenades>0){botMove(bot,nxM*0.06,nzM*0.06);}
    else{bot.strafeTimer-=dt;if(bot.strafeTimer<=0){bot.strafeDir=Math.random()<0.5?1:-1;bot.strafeTimer=1+Math.random();}botMove(bot,-nzM*bot.strafeDir*0.06,nxM*bot.strafeDir*0.06);}
    bot.yaw=Math.atan2(mdxB,mdzB);
    var wM=bot.walking?Math.sin(tGlobal*9):0;
    var bobM=bot.walking?Math.abs(Math.sin(tGlobal*9))*0.07:0;
    bot.group.position.set(bot.x,bobM,bot.z);bot.group.rotation.y=bot.yaw;
    bot.armL.rotation.x=-wM*0.5;bot.armR.rotation.x=-0.6;
    bot.legL.rotation.x=wM;bot.legR.rotation.x=-wM;
    continue;
   }
  }
  if(!bot.weapon){
   var nearest=findNearestLoot(bot.x,bot.z);
   if(nearest){
    var dxl=nearest.x-bot.x,dzl=nearest.z-bot.z,dl=Math.hypot(dxl,dzl);
    if(dl>35){var ncar=botFindCar(bot,15);if(ncar){botEnterCar(bot,ncar);bot.target={x:nearest.x,z:nearest.z};continue;}}
    if(dl>0.5){botMove(bot,(dxl/dl)*0.075,(dzl/dl)*0.075);bot.yaw=Math.atan2(dxl,dzl);bot.walking=true;}
    else{botTryLoot(bot);bot.walking=false;}
   }else{
    if(tGlobal>bot.nextThink){var np=randPointFree();bot.target=np;bot.nextThink=tGlobal+2+Math.random()*3;}
    var dx0=bot.target.x-bot.x,dz0=bot.target.z-bot.z,dl0=Math.hypot(dx0,dz0);
    bot.walking=false;
    if(dl0>0.6){botMove(bot,(dx0/dl0)*0.06,(dz0/dl0)*0.06);bot.yaw=Math.atan2(dx0,dz0);bot.walking=true;}
   }
   var wN=bot.walking?Math.sin(tGlobal*9):0;
   var bobN=bot.walking?Math.abs(Math.sin(tGlobal*9))*0.07:0;
   bot.group.position.set(bot.x,bobN,bot.z);bot.group.rotation.y=bot.yaw;
   bot.armL.rotation.x=-wN*0.5;bot.armR.rotation.x=wN*0.5;
   bot.legL.rotation.x=wN;bot.legR.rotation.x=-wN;
   continue;
  }
  var ENGAGE=55;
  var target=null,targetIsPlayer=false,tdist=Infinity,tdx=0,tdz=0;
  if((game.state==='playing'||game.state==='driving')&&game.health>0){
   var pdx=player.x-bot.x,pdz=player.z-bot.z,pd=Math.hypot(pdx,pdz);
   if(pd<ENGAGE){target={x:player.x,z:player.z,ref:null};targetIsPlayer=true;tdist=pd;tdx=pdx;tdz=pdz;}
  }
  for(var k=0;k<bots.length;k++){
   var ob=bots[k];if(ob===bot||!ob.alive||ob.dropState!=='grounded'||!ob.weapon)continue;
   var odx=ob.x-bot.x,odz=ob.z-bot.z,od=Math.hypot(odx,odz);
   var bias=targetIsPlayer?0.92:1.0;
   if(od<ENGAGE&&od*bias<tdist){target={x:ob.x,z:ob.z,ref:ob};targetIsPlayer=false;tdist=od;tdx=odx;tdz=odz;}
  }
  var engaging=target!==null;
  if(engaging){
   bot.nextThink=0;
   var losOK=hasLOS(bot.x,bot.z,target.x,target.z);
   var desired=12,mvx=0,mvz=0;
   var dirX=tdx/tdist,dirZ=tdz/tdist;
   if(!losOK){bot.strafeTimer-=dt;if(bot.strafeTimer<=0){bot.strafeDir=Math.random()<0.5?1:-1;bot.strafeTimer=0.9+Math.random()*1.2;}mvx=-dirZ*bot.strafeDir*0.8+dirX*0.6;mvz=dirX*bot.strafeDir*0.8+dirZ*0.6;if(bot.grenades>0 && bot.grenadeCooldown<=0 && tdist<22){if(Math.random()<0.02){throwGrenade(bot.x,bot.z,target.x,target.z,bot);bot.grenades--;bot.grenadeCooldown=4+Math.random()*3;}}}
   else{if(tdist>desired+3){mvx=dirX;mvz=dirZ;}else if(tdist<desired-3){mvx=-dirX*0.7;mvz=-dirZ*0.7;}bot.strafeTimer-=dt;if(bot.strafeTimer<=0){bot.strafeDir=Math.random()<0.5?1:-1;bot.strafeTimer=0.8+Math.random()*1.4;}if(tdist<desired+8){mvx+=-dirZ*bot.strafeDir*0.8;mvz+=dirX*bot.strafeDir*0.8;}}
   var mlen=Math.hypot(mvx,mvz);if(mlen>0.001){mvx/=mlen;mvz/=mlen;}
   bot.walking=botMove(bot,mvx*0.06,mvz*0.06);bot.yaw=Math.atan2(tdx,tdz);
  }else{
   if(tGlobal>bot.nextThink){var np2=randPointFree();bot.target=np2;bot.nextThink=tGlobal+1.8+Math.random()*2.5;}
   var dx=bot.target.x-bot.x,dz=bot.target.z-bot.z,dl=Math.hypot(dx,dz);
   bot.walking=false;
   if(dl>0.6){var movedW=botMove(bot,(dx/dl)*0.055,(dz/dl)*0.055);bot.yaw=Math.atan2(dx,dz);bot.walking=movedW;if(!movedW&&bot.stuck>8){bot.nextThink=0;bot.stuck=0;}}
  }
  // Natural walking animation
  var walkCycle=bot.walking?Math.sin(tGlobal*9):0;
  var bobY2=bot.walking?Math.abs(Math.sin(tGlobal*9))*0.07:0;
  bot.group.position.set(bot.x,bobY2,bot.z);bot.group.rotation.y=bot.yaw;
  // arms counter-swing with legs
  bot.armL.rotation.x=-walkCycle*0.5;
  bot.armR.rotation.x=engaging?-0.35:walkCycle*0.5;
  bot.legL.rotation.x=walkCycle;
  bot.legR.rotation.x=-walkCycle;
  if(engaging){
   bot.shootTimer-=dt;
   if(bot.shootTimer<=0){
    bot.shootTimer=w.rate+0.20+Math.random()*0.35;
    var hasSight=hasLOS(bot.x,bot.z,target.x,target.z);
    if(hasSight){
     var volScale=Math.max(0.15,1-tdist/ENGAGE);var pan=Math.max(-1,Math.min(1,tdx/20));
     playBotShot(volScale,pan);bot.flash.visible=true;bot.flashT=0.08;
     var distFactor=1-(tdist/ENGAGE)*0.30;var baseChance=targetIsPlayer?0.58:0.62;var hitChance=baseChance*distFactor;
     if(Math.random()<hitChance){
      var dmg=w.dmg*(0.75+Math.random()*0.5);
      if(targetIsPlayer){game.health=Math.max(0,game.health-dmg);updateHUD();flashDamage();if(game.health<=0)die();}
      else{var tb=target.ref;if(tb&&tb.alive){tb.hp-=dmg;tb.hitFlash=1;if(tb.hp<=0)killBot(tb,bot);}}
     }
    }else bot.shootTimer=0.25+Math.random()*0.35;
   }
  }
  if(bot.flashT>0){bot.flashT-=dt;if(bot.flashT<=0){bot.flashT=0;bot.flash.visible=false;}}
 }
}

function lerp(a,b,t){return a+(b-a)*t;}

 var progress=Math.min(planeElapsed/planeDuration,1);

function updatePlaying(dt,mx,my){
 var speed=0.13;
 var sin=Math.sin(player.yaw),cos=Math.cos(player.yaw);
 var vx=(-sin*-my+cos*mx)*speed,vz=(-cos*-my-sin*mx)*speed;
 var nx=player.x+vx,nz=player.z+vz;
 if(!collide(nx,player.z))player.x=nx;
 if(!collide(player.x,nz))player.z=nz;
 var moving=(mx!==0||my!==0);
 // Natural walking bob for player
 if(!player.grounded||player.vy>0){
  player.vy-=25*dt;player.y+=player.vy*dt;
  if(player.y<=GROUND_Y){player.y=GROUND_Y;player.vy=0;player.grounded=true;}
 }else{
  var walkBob=0,swayX=0,swayZ=0;
  if(moving){
   player.walkPhase+=dt*11;
   walkBob=Math.abs(Math.sin(player.walkPhase))*0.09;
   // slight side sway
   swayX=Math.cos(player.walkPhase*0.5)*0.02;
   swayZ=Math.sin(player.walkPhase*0.5)*0.02;
  }else{
   player.walkPhase=0;
   walkBob=0.015+Math.sin(tGlobal*1.5)*0.01;
  }
  player.y=GROUND_Y+walkBob;
  // Camera slight sway (applied after rotation via camera position tweak, but simpler: skip)
 }
 if(player.jumpCooldown>0)player.jumpCooldown-=dt;
 if(moving&&player.grounded&&tGlobal-lastStepT>0.32){lastStepT=tGlobal;playFootstep();}
 checkPlayerLoot();updateJumpButtonMode();
}

function findNearbyCar(){if(drivingCar||drivingTank||drivingMLRS)return null;var best=null,bd=3.5;for(var i=0;i<cars.length;i++){var c=cars[i];if(c.occupied||c.occupiedByBot)continue;var d=Math.hypot(c.x-player.x,c.z-player.z);if(d<bd){bd=d;best=c;}}return best;}
function findNearbyTank(){if(drivingTank||drivingCar||drivingMLRS||!tank||tank.occupied||tank.hp<=0)return null;var d=Math.hypot(tank.x-player.x,tank.z-player.z);if(d<4.5)return tank;return null;}
function findNearbyMLRS(){if(drivingMLRS||drivingCar||drivingTank||!mlrs||mlrs.occupied||mlrs.hp<=0)return null;var d=Math.hypot(mlrs.x-player.x,mlrs.z-player.z);if(d<5.0)return mlrs;return null;}
function enterCar(car){if(!car||drivingCar)return;drivingCar=car;car.occupied=true;game.state='driving';car.velocity=0;gunGroup.visible=false;armsGroup.visible=false;startCarEngine();elJumpBtn.classList.remove('carMode');elJumpBtn.classList.add('exitMode');elJumpIcon.textContent='🚪';elJumpLabel.textContent='خروج';elSpeedo.style.display='block';showCenterMsg('🚗 سوار شدی — می‌تونی تیر بخوری!',1800);}
function exitCar(){if(!drivingCar)return;var car=drivingCar;car.velocity=0;car.occupied=false;drivingCar=null;var sinA=Math.sin(car.yaw),cosA=Math.cos(car.yaw);player.x=car.x+cosA*2.4;player.z=car.z-sinA*2.4;if(collide(player.x,player.z)){player.x=car.x-cosA*2.4;player.z=car.z+sinA*2.4;}player.y=GROUND_Y;player.vy=0;player.grounded=true;player.yaw=car.yaw+Math.PI/2;player.pitch=0;game.state='playing';gunGroup.visible=!!game.weapon;stopCarEngine();elJumpBtn.classList.remove('exitMode');elSpeedo.style.display='none';updateJumpButtonMode();showCenterMsg('پیاده شدی',1000);}
function enterTank(t){if(!t||drivingTank||t.occupied)return;drivingTank=t;t.occupied=true;game.state='drivingTank';gunGroup.visible=false;armsGroup.visible=false;startCarEngine();elJumpBtn.classList.remove('carMode');elJumpBtn.classList.remove('tankMode');elJumpBtn.classList.remove('mlrsMode');elJumpBtn.classList.add('exitMode');elJumpIcon.textContent='🚪';elJumpLabel.textContent='خروج';elBtnFire.style.opacity=1;elBtnFire.classList.remove('mlrsFire');elTankHpBar.style.display='block';elTankHpLabel.style.display='block';updateTankHpBar();elSpeedo.style.display='block';showCenterMsg('🚜 تانک — بات‌ها نارنجک می‌ریزن!',2400);}
function exitTank(){if(!drivingTank)return;var t=drivingTank;t.velocity=0;t.occupied=false;drivingTank=null;var sinA=Math.sin(t.yaw),cosA=Math.cos(t.yaw);player.x=t.x+cosA*3.2;player.z=t.z-sinA*3.2;if(collide(player.x,player.z)){player.x=t.x-cosA*3.2;player.z=t.z+sinA*3.2;}player.y=GROUND_Y;player.vy=0;player.grounded=true;player.yaw=t.yaw+Math.PI/2;player.pitch=0;game.state='playing';gunGroup.visible=!!game.weapon;stopCarEngine();elJumpBtn.classList.remove('exitMode');elBtnFire.style.opacity=0;elTankHpBar.style.display='none';elTankHpLabel.style.display='none';elSpeedo.style.display='none';updateJumpButtonMode();showCenterMsg('از تانک پیاده شدی',1000);}
function enterMLRS(m){if(!m||drivingMLRS||m.occupied)return;drivingMLRS=m;m.occupied=true;game.state='drivingMLRS';gunGroup.visible=false;armsGroup.visible=false;startCarEngine();elJumpBtn.classList.remove('carMode');elJumpBtn.classList.remove('tankMode');elJumpBtn.classList.remove('mlrsMode');elJumpBtn.classList.add('exitMode');elJumpIcon.textContent='🚪';elJumpLabel.textContent='خروج';elBtnFire.style.opacity=1;elBtnFire.classList.add('mlrsFire');elTankHpBar.style.display='none';elTankHpLabel.style.display='none';elSpeedo.style.display='block';showCenterMsg('🚀 MLRS — با نگاه برجک رو بچرخون!',2800);}
function exitMLRS(){if(!drivingMLRS)return;var m=drivingMLRS;m.velocity=0;m.occupied=false;drivingMLRS=null;var sinA=Math.sin(m.yaw),cosA=Math.cos(m.yaw);player.x=m.x+cosA*3.5;player.z=m.z-sinA*3.5;if(collide(player.x,player.z)){player.x=m.x-cosA*3.5;player.z=m.z+sinA*3.5;}player.y=GROUND_Y;player.vy=0;player.grounded=true;player.yaw=m.yaw+Math.PI/2;player.pitch=0;game.state='playing';gunGroup.visible=!!game.weapon;stopCarEngine();elJumpBtn.classList.remove('exitMode');elBtnFire.style.opacity=0;elBtnFire.classList.remove('mlrsFire');elSpeedo.style.display='none';updateJumpButtonMode();showCenterMsg('از MLRS پیاده شدی',1000);}
function updateTankHpBar(){if(!tank)return;elTankHpInner.style.width=Math.max(0,tank.hp/tank.maxHp*100)+'%';}
function updateJumpButtonMode(){
 if(game.state!=='playing')return;
 var nm=findNearbyMLRS();if(nm){elJumpBtn.classList.add('mlrsMode');elJumpIcon.textContent='🚀';elJumpLabel.textContent='MLRS';return;}
 var nt=findNearbyTank();if(nt){elJumpBtn.classList.add('tankMode');elJumpIcon.textContent='🚜';elJumpLabel.textContent='تانک';return;}
 var nc=findNearbyCar();
 if(nc){elJumpBtn.classList.add('carMode');elJumpIcon.textContent='🚗';elJumpLabel.textContent='سوار';}
 else{elJumpBtn.classList.remove('carMode');elJumpIcon.textContent='🦘';elJumpLabel.textContent='پرش';}
 elJumpBtn.classList.remove('tankMode');elJumpBtn.classList.remove('mlrsMode');
}
function updateDriving(dt,mx,my){
 var car=drivingCar;if(!car)return;
 var throttle=-my,accel=0;
 if(throttle>0.1)accel=0.010*throttle;else if(throttle<-0.1)accel=0.006*throttle;
 car.velocity+=accel;car.velocity*=0.97;car.velocity=Math.max(-0.15,Math.min(0.40,car.velocity));
 if(Math.abs(car.velocity)>0.005)car.yaw-=mx*0.038*(car.velocity>0?1:-1);
 var nx=car.x-Math.sin(car.yaw)*car.velocity,nz=car.z-Math.cos(car.yaw)*car.velocity;
 var blocked=collide(nx,nz,car);
 if(!blocked){for(var ci=0;ci<cars.length;ci++){var oc=cars[ci];if(oc===car)continue;if(Math.hypot(oc.x-nx,oc.z-nz)<3.4){blocked=true;break;}}}
 if(!blocked){car.x=nx;car.z=nz;var sinA=Math.sin(car.yaw),cosA=Math.cos(car.yaw);car.colliderFront.x=car.x-sinA*1.3;car.colliderFront.z=car.z-cosA*1.3;car.colliderBack.x=car.x+sinA*1.3;car.colliderBack.z=car.z+cosA*1.3;}else car.velocity*=-0.25;
 if(car.x<-MAP_HALF+3){car.x=-MAP_HALF+3;car.velocity=0;}if(car.x>MAP_HALF-3){car.x=MAP_HALF-3;car.velocity=0;}
 if(car.z<-MAP_HALF+3){car.z=-MAP_HALF+3;car.velocity=0;}if(car.z>MAP_HALF-3){car.z=MAP_HALF-3;car.velocity=0;}
 car.group.position.set(car.x,0,car.z);car.group.rotation.y=car.yaw;
 player.x=car.x;player.z=car.z;
 var camBack=7.0,camX=car.x+Math.sin(car.yaw)*camBack,camZ=car.z+Math.cos(car.yaw)*camBack;
 camera.position.set(camX,3.4,camZ);camera.rotation.set(0,0,0);camera.rotateY(car.yaw);camera.rotateX(-0.12);
 elSpeedVal.textContent=Math.round(Math.abs(car.velocity)*220);setCarEngineSpeed(car.velocity);
}
function updateDrivingTank(dt,mx,my){
 var t=drivingTank;if(!t)return;
 t.group.userData.turret.rotation.y=t.turretYaw;
 var throttle=-my,accel=0;
 if(throttle>0.1)accel=0.006*throttle;else if(throttle<-0.1)accel=0.004*throttle;
 t.velocity+=accel;t.velocity*=0.94;t.velocity=Math.max(-0.10,Math.min(0.22,t.velocity));
 if(Math.abs(t.velocity)>0.003)t.yaw-=mx*0.026*(t.velocity>0?1:-1);
 var nx=t.x-Math.sin(t.yaw)*t.velocity,nz=t.z-Math.cos(t.yaw)*t.velocity;
 var blocked=collide(nx,nz,null,t);
 if(!blocked){for(var ci=0;ci<cars.length;ci++){var oc=cars[ci];if(Math.hypot(oc.x-nx,oc.z-nz)<3.4){blocked=true;break;}}}
 if(!blocked){t.x=nx;t.z=nz;updateTankColliders();}else t.velocity*=-0.2;
 if(t.x<-MAP_HALF+4){t.x=-MAP_HALF+4;t.velocity=0;}if(t.x>MAP_HALF-4){t.x=MAP_HALF-4;t.velocity=0;}
 if(t.z<-MAP_HALF+4){t.z=-MAP_HALF+4;t.velocity=0;}if(t.z>MAP_HALF-4){t.z=MAP_HALF-4;t.velocity=0;}
 t.group.position.set(t.x,0,t.z);t.group.rotation.y=t.yaw;
 player.x=t.x;player.z=t.z;
 var camBack=8.5,camAngle=t.yaw+t.turretYaw,camX=t.x+Math.sin(camAngle)*camBack,camZ=t.z+Math.cos(camAngle)*camBack;
 camera.position.set(camX,4.2,camZ);camera.rotation.set(0,0,0);camera.rotateY(camAngle);camera.rotateX(-0.14);
 elSpeedVal.textContent=Math.round(Math.abs(t.velocity)*220);setCarEngineSpeed(t.velocity);
 if(t.fireCooldown>0)t.fireCooldown-=dt;updateTankHpBar();
}
function updateDrivingMLRS(dt,mx,my){
 var m=drivingMLRS;if(!m)return;
 m.group.userData.turret.rotation.y=m.turretYaw;
 var throttle=-my,accel=0;
 if(throttle>0.1)accel=0.008*throttle;else if(throttle<-0.1)accel=0.005*throttle;
 m.velocity+=accel;m.velocity*=0.95;m.velocity=Math.max(-0.12,Math.min(0.28,m.velocity));
 if(Math.abs(m.velocity)>0.003)m.yaw-=mx*0.030*(m.velocity>0?1:-1);
 var nx=m.x-Math.sin(m.yaw)*m.velocity,nz=m.z-Math.cos(m.yaw)*m.velocity;
 var blocked=collide(nx,nz,null,null,m);
 if(!blocked){for(var ci=0;ci<cars.length;ci++){var oc=cars[ci];if(Math.hypot(oc.x-nx,oc.z-nz)<3.4){blocked=true;break;}}}
 if(!blocked){m.x=nx;m.z=nz;updateMLRSColliders();}else m.velocity*=-0.2;
 if(m.x<-MAP_HALF+4){m.x=-MAP_HALF+4;m.velocity=0;}if(m.x>MAP_HALF-4){m.x=MAP_HALF-4;m.velocity=0;}
 if(m.z<-MAP_HALF+4){m.z=-MAP_HALF+4;m.velocity=0;}if(m.z>MAP_HALF-4){m.z=MAP_HALF-4;m.velocity=0;}
 m.group.position.set(m.x,0,m.z);m.group.rotation.y=m.yaw;
 player.x=m.x;player.z=m.z;
 var camBack=10.0,camAngle=m.yaw+m.turretYaw,camX=m.x+Math.sin(camAngle)*camBack,camZ=m.z+Math.cos(camAngle)*camBack;
 camera.position.set(camX,5.2,camZ);camera.rotation.set(0,0,0);camera.rotateY(camAngle);camera.rotateX(-0.16);
 elSpeedVal.textContent=Math.round(Math.abs(m.velocity)*220);setCarEngineSpeed(m.velocity);
 if(m.fireCooldown>0)m.fireCooldown-=dt;
 if(m.barrageState){m.barrageState.timer-=dt;if(m.barrageState.timer<=0){m.barrageState.timer=0.28;fireMLRSSingle(m);m.barrageState.remaining--;if(m.barrageState.remaining<=0){m.barrageState=null;m.fireCooldown=3.5;}}}
}
function fireMLRSSingle(m){var ang=m.yaw+m.turretYaw,spread=(Math.random()-0.5)*0.18,angled=ang+spread;var dx=-Math.sin(angled),dz=-Math.cos(angled);var startX=m.x+dx*3.5,startY=2.6+Math.random()*0.3,startZ=m.z+dz*3.5;var upArc=0.55+Math.random()*0.15;spawnProjectile(startX,startY,startZ,dx,upArc,dz,32,'mlrs',150,'mlrs');playMLRSShot();camShake=Math.max(camShake,0.5);spawnExplosion(m.x+dx*1.5,2.2,m.z+dz*1.5,0.8);}
function fireMLRSBarrage(){if(!drivingMLRS)return;var m=drivingMLRS;if(m.fireCooldown>0||m.barrageState)return;ensureAudio();m.barrageState={timer:0,remaining:6};camShake=Math.max(camShake,0.6);}
function fireCannon(){if(!drivingTank)return;var t=drivingTank;if(t.fireCooldown>0)return;t.fireCooldown=1.6;ensureAudio();playCannonShot();var ang=t.yaw+t.turretYaw;var dx=-Math.sin(ang);var dz=-Math.cos(ang);var startX=t.x+dx*4.0;var startY=1.8;var startZ=t.z+dz*4.0;spawnProjectile(startX,startY,startZ,dx,0.05,dz,45,'cannon',120,'tank');camShake=Math.max(camShake,0.7);}

var cullTick=0;
function updateCulling(){
 cullTick++;
 if(cullTick%5!==0)return;
 var px=player.x,pz=player.z;
 for(var i=0;i<cullables.length;i++){var m=cullables[i];if(!m)continue;var dx=m.position.x-px,dz=m.position.z-pz;m.visible=(dx*dx+dz*dz<CULL_DIST2);}
 for(var bi=0;bi<bots.length;bi++){var b=bots[bi];if(!b.alive||b.dropState==='waiting')continue;if(b.dropState!=='grounded'){b.group.visible=true;continue;}if(b.car){b.group.visible=false;continue;}var bdx=b.x-px,bdz=b.z-pz;b.group.visible=(bdx*bdx+bdz*bdz<CULL_DIST2);}
 if(boss&&boss.alive){var bdx2=boss.x-px,bdz2=boss.z-pz;boss.group.visible=(bdx2*bdx2+bdz2*bdz2<CULL_DIST2);}
}

function onJumpTap(e){
 if(e){e.preventDefault();e.stopPropagation();}
 ensureAudio();
 if(game.state==='plane'){doJump();return;}
 if(game.state==='falling'){openParachute();return;}
 if(game.state==='driving'){exitCar();return;}
 if(game.state==='drivingTank'){exitTank();return;}
 if(game.state==='drivingMLRS'){exitMLRS();return;}
 if(game.state==='playing'){
  var nm=findNearbyMLRS();if(nm){enterMLRS(nm);return;}
  var nt=findNearbyTank();if(nt){enterTank(nt);return;}
  var nc=findNearbyCar();if(nc)enterCar(nc);else playerJump();
 }
}
elJumpBtn.addEventListener('touchstart',onJumpTap,{passive:false});
elJumpBtn.addEventListener('click',onJumpTap);
elJumpBtn.addEventListener('mousedown',function(e){e.stopPropagation();});
function onFireTap(e){if(e){e.preventDefault();e.stopPropagation();}if(game.state==='drivingTank')fireCannon();else if(game.state==='drivingMLRS')fireMLRSBarrage();}
elBtnFire.addEventListener('touchstart',onFireTap,{passive:false});
elBtnFire.addEventListener('click',onFireTap);
elBtnFire.addEventListener('mousedown',function(e){e.stopPropagation();});

$('btnStart').addEventListener('click',function(){
 ensureAudio();started=true;game.state='plane';
 bots.forEach(function(bot){bot.spawnAt=tGlobal+1+Math.random()*12;bot.dropState='waiting';});
 elStart.style.display='none';elJumpBtn.style.opacity=1;
 elJumpIcon.textContent='🪂';elJumpLabel.textContent='پرش';
 startEngine();
 showCenterMsg('در حال پرواز... برای پرش دکمه را بزن',2200);
});
$('btnRestart').addEventListener('click',function(){location.reload();});

document.querySelectorAll('.qBtn').forEach(function(btn){
 if(btn.getAttribute('data-q')===currentQuality)btn.classList.add('active');
 else btn.classList.remove('active');
 btn.addEventListener('click',function(){
  document.querySelectorAll('.qBtn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var q=btn.getAttribute('data-q');
  localStorage.setItem('warzone_quality',q);
  var names={low:'کم',medium:'متوسط',high:'زیاد'};
  showCenterMsg('کیفیت: '+names[q]+' — برای اعمال کامل F5 بزن',2500);
 });
});

function updateMinimap(){
 mmCtx.clearRect(0,0,104,104);
 mmCtx.save();mmCtx.beginPath();mmCtx.arc(52,52,50,0,Math.PI*2);mmCtx.clip();
 mmCtx.fillStyle='rgba(10,25,10,.9)';mmCtx.fillRect(0,0,104,104);
 var scale=50/MAP_HALF;
 // market
 mmCtx.fillStyle='rgba(120,40,180,.35)';
 var bmx=52+(MARKET_X-player.x)*scale,bmz=52+(MARKET_Z-player.z)*scale;
 mmCtx.beginPath();mmCtx.arc(bmx,bmz,42*scale,0,Math.PI*2);mmCtx.fill();
 // prison
 mmCtx.fillStyle='rgba(60,60,80,.45)';
 var pmx=52+(PX-player.x)*scale,pmz=52+(PZ-player.z)*scale;
 mmCtx.beginPath();mmCtx.arc(pmx,pmz,52*scale,0,Math.PI*2);mmCtx.fill();
 mmCtx.strokeStyle='rgba(120,255,120,.6)';mmCtx.lineWidth=1.5;
 mmCtx.beginPath();mmCtx.arc(52-player.x*scale,52-player.z*scale,game.zoneRadius*scale,0,Math.PI*2);mmCtx.stroke();
 if(tank&&tank.hp>0){var tmx=52+(tank.x-player.x)*scale,tmz=52+(tank.z-player.z)*scale;if(tmx>-6&&tmx<110&&tmz>-6&&tmz<110){mmCtx.fillStyle='#ffaa33';mmCtx.fillRect(tmx-3,tmz-3,6,6);}}
 if(mlrs&&mlrs.hp>0){var mmx=52+(mlrs.x-player.x)*scale,mmz=52+(mlrs.z-player.z)*scale;if(mmx>-6&&mmx<110&&mmz>-6&&mmz<110){mmCtx.fillStyle='#cc66ff';mmCtx.fillRect(mmx-3,mmz-3,6,6);}}
 if(boss&&boss.alive){var bxx=52+(boss.x-player.x)*scale,bzz=52+(boss.z-player.z)*scale;if(bxx>-8&&bxx<112&&bzz>-8&&bzz<112){mmCtx.fillStyle='#ff0000';mmCtx.fillRect(bxx-4,bzz-4,8,8);}}
 for(var ci=0;ci<cars.length;ci++){var co=cars[ci];var cx3=52+(co.x-player.x)*scale,cz3=52+(co.z-player.z)*scale;if(cx3>-4&&cx3<108&&cz3>-4&&cz3<108){mmCtx.fillStyle=co.occupiedByBot?'#ff3333':'#5599ff';mmCtx.fillRect(cx3-2,cz3-2,4,4);}}
 for(var li=0;li<loots.length;li++){var lo=loots[li];if(lo.taken)continue;var lx3=52+(lo.x-player.x)*scale,lz3=52+(lo.z-player.z)*scale;if(lx3>-2&&lx3<106&&lz3>-2&&lz3<106){mmCtx.fillStyle=(lo.weapon==='sniper')?'#ffcc44':(lo.weapon==='rpg')?'#ff5522':(lo.weapon==='laser')?'#00ddff':'#88ff88';mmCtx.fillRect(lx3-1.5,lz3-1.5,3,3);}}
 mmCtx.fillStyle='#ff5555';
 for(var i=0;i<bots.length;i++){var bo=bots[i];if(!bo.alive)continue;if(bo.car)continue;var bx=52+(bo.x-player.x)*scale,bz=52+(bo.z-player.z)*scale;if(bx>-2&&bx<106&&bz>-2&&bz<106){mmCtx.beginPath();mmCtx.arc(bx,bz,2,0,Math.PI*2);mmCtx.fill();}}
 mmCtx.restore();
 mmCtx.save();mmCtx.translate(52,52);mmCtx.rotate(player.yaw);
 mmCtx.fillStyle='#9f9';mmCtx.beginPath();mmCtx.moveTo(0,-6);mmCtx.lineTo(4,5);mmCtx.lineTo(-4,5);mmCtx.closePath();mmCtx.fill();
 mmCtx.restore();
}

var clock=new THREE.Clock();
updateHUD();
function animate(){
 requestAnimationFrame(animate);
 var dt=Math.min(clock.getDelta(),0.05);tGlobal+=dt;
 if(game.fireCooldown>0)game.fireCooldown=Math.max(0,game.fireCooldown-dt);
 var mx=joyVec.x,my=joyVec.y;
 if(keys['KeyW']||keys['ArrowUp'])my=-1;
 if(keys['KeyS']||keys['ArrowDown'])my=1;
 if(keys['KeyA']||keys['ArrowLeft'])mx=-1;
 if(keys['KeyD']||keys['ArrowRight'])mx=1;

 if(game.state==='plane')updatePlane(dt);
 else if(game.state==='falling')updateFalling(dt,mx,my);
 else if(game.state==='parachute')updateParachute(dt,mx,my);
 else if(game.state==='playing'){updatePlaying(dt,mx,my);updateBots(dt);updateBoss(dt);updateZone(dt);}
 else if(game.state==='driving'){updateDriving(dt,mx,my);updateBots(dt);updateBoss(dt);updateZone(dt);}
 else if(game.state==='drivingTank'){updateDrivingTank(dt,mx,my);updateBots(dt);updateBoss(dt);updateZone(dt);}
 else if(game.state==='drivingMLRS'){updateDrivingMLRS(dt,mx,my);updateBots(dt);updateBoss(dt);updateZone(dt);}
 else if(game.state==='wait'){
  player.x=planeStart.x;player.z=planeStart.z;player.y=planeStart.y+1.5;
  player.yaw=-planeAngle-Math.PI/2;player.pitch=-0.1;
  planeGroup.position.set(planeStart.x,planeStart.y,planeStart.z);
  planeGroup.rotation.y=-planeAngle;
 }
 if(started){updatePlaneFlight(dt);updateBotDrops(dt);}
 updateLoots(dt);updateProjectiles(dt);updateGrenades(dt);updateExplosions(dt);updateLaserBeams(dt);updateCulling();

 if(camShake>0){var shakeAmt=camShake*0.5;camera.position.x+=(Math.random()-0.5)*shakeAmt;camera.position.y+=(Math.random()-0.5)*shakeAmt;camera.position.z+=(Math.random()-0.5)*shakeAmt;camShake=Math.max(0,camShake-dt*2.5);}

 if(game.state==='playing'||game.state==='falling'||game.state==='parachute'||game.state==='wait'||game.state==='plane'){
  camera.position.set(player.x,player.y,player.z);camera.rotation.set(0,0,0);camera.rotateY(player.yaw);camera.rotateX(player.pitch);
 }
 updateGunAnim(dt);
 flick.intensity=1.2+Math.sin(tGlobal*13)*0.2;
 updateMinimap();
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
